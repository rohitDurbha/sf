<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="Rohit Durbha is a full-stack engineer. Roam an isometric San Francisco and find his work across the city.">
<link rel="preconnect" href="https://tiles.isometricsf.com">
<title>Rohit Durbha Software Portfolio</title>
<style>
@font-face{font-family:"Geist Serif";src:url("fonts/GeistSerifVF.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Geist Pixel";src:url("fonts/GeistPixelVF.woff2") format("woff2");font-display:swap}

/* Layout idea: the isometric map of San Francisco fills the screen and can be roamed freely.
   Caption plates float over it, one for each stop, and never block the map itself. */
:root{
  --water:#347484; --paper:#F8F9FA; --plate:#F8F9FAF2; --ink:#14161C; --muted:#566070; --line:#14161C26;
  --lilac:#8E84E0; --mint:#4FB08A; --peach:#E08A62; --sky:#5C9BD6; --butter:#BF9C22; --rose:#D6779B;
  --serif:"Geist Serif",Georgia,"Times New Roman",serif;
  --pixel:"Geist Pixel","Geist Serif",ui-monospace,monospace;
  --ease:cubic-bezier(.22,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --water:#091622; --paper:#0C101B; --plate:#0C101BEE; --ink:#E9EAF0; --muted:#98A0B0; --line:#E9EAF029;
    --lilac:#BDB6F5; --mint:#A3E0C7; --peach:#F6C2A6; --sky:#A8CEF0; --butter:#EEDD9A; --rose:#F2B8CC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --water:#091622; --paper:#0C101B; --plate:#0C101BEE; --ink:#E9EAF0; --muted:#98A0B0; --line:#E9EAF029;
  --lilac:#BDB6F5; --mint:#A3E0C7; --peach:#F6C2A6; --sky:#A8CEF0; --butter:#EEDD9A; --rose:#F2B8CC;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--water);color:var(--ink);font-family:var(--serif);font-size:1.0625rem;line-height:1.6;
  transition:background-color .9s var(--ease),color .9s var(--ease);overflow:hidden;overscroll-behavior:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em;transition:text-decoration-thickness .3s var(--ease),text-underline-offset .3s var(--ease)}
a:hover{text-decoration-thickness:3px;text-underline-offset:.3em}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
p{margin:0}
h1,h2{font-weight:400;margin:0;text-wrap:balance;font-variation-settings:"ELSH" 25}
button{font:inherit;color:inherit}

#map{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}

.glyph{display:inline-block;width:.62em;height:.62em;background:currentColor;flex:none;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transition:clip-path .6s var(--ease),transform .6s var(--ease)}
.glyph.tri{clip-path:polygon(50% 0,50% 0,100% 100%,0 100%)}
.px{font-family:var(--pixel);font-variation-settings:"ELSH" 1;font-variant-numeric:tabular-nums}
.chip{background:var(--plate);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background-color .9s var(--ease),border-color .4s var(--ease)}

header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:.6rem;padding:.8rem clamp(.8rem,2.4vw,1.6rem);font-size:.95rem;pointer-events:none}
header>*{pointer-events:auto}
.me{appearance:none;display:flex;align-items:center;gap:.55rem;margin-right:auto;padding:.4rem .75rem;cursor:pointer;white-space:nowrap}
.me:hover .glyph,.ctl:hover .glyph{clip-path:polygon(50% 0,50% 0,100% 100%,0 100%)}
.ctl{appearance:none;display:flex;align-items:center;gap:.5rem;padding:.4rem .75rem;cursor:pointer;white-space:nowrap}
.ctl:hover,.me:hover{border-color:var(--ink)}
#theme .glyph.tri{clip-path:polygon(50% 0,50% 0,100% 100%,0 100%)}

/* stop rail */
#rail{position:fixed;right:clamp(.6rem,1.6vw,1.4rem);top:50%;transform:translateY(-50%);z-index:4;list-style:none;margin:0;padding:.7rem .55rem;display:flex;flex-direction:column;gap:.5rem}
#rail button{appearance:none;background:none;border:0;padding:.18rem;display:flex;align-items:center;cursor:pointer;position:relative;color:var(--muted)}
#rail .glyph{width:9px;height:9px}
#rail .lbl{position:absolute;right:calc(100% + .9rem);top:50%;transform:translate(6px,-50%);white-space:nowrap;font-size:.85rem;padding:.15rem .55rem;opacity:0;pointer-events:none;color:var(--ink);
  transition:opacity .35s var(--ease),transform .45s var(--ease)}
#rail button:hover .lbl,#rail button:focus-visible .lbl{opacity:1;transform:translate(0,-50%)}
#rail button[aria-current="true"]{color:var(--accent,var(--ink))}
#rail button[aria-current="true"] .glyph{clip-path:polygon(50% 0,50% 0,100% 100%,0 100%);transform:scale(1.4)}

/* map controls */
#zoom{position:fixed;right:clamp(.6rem,1.6vw,1.4rem);bottom:2.6rem;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:.4rem}
#zoom .row{display:flex;gap:.4rem}
#zoom button{appearance:none;width:2.3rem;height:2.3rem;display:grid;place-items:center;cursor:pointer;font-size:1.15rem;line-height:1}
#zoom button:hover{border-color:var(--ink)}
#here{font-size:.74rem;color:var(--muted);padding:.35rem .6rem;white-space:nowrap}
#credit{position:fixed;left:0;right:0;bottom:0;z-index:4;font-size:.68rem;line-height:1.35;color:var(--muted);padding:.32rem .8rem;text-align:center;border-width:1px 0 0 0}
#credit a{color:var(--ink)}
#tip{position:fixed;z-index:6;pointer-events:none;padding:.2rem .6rem;font-size:.85rem;opacity:0;transform:translate(-50%,-150%);transition:opacity .25s;white-space:nowrap}

/* caption plate */
#plate{position:fixed;z-index:3;left:clamp(.8rem,2.4vw,1.6rem);top:4.4rem;bottom:2.6rem;width:min(30.5rem,calc(100vw - 1.6rem));display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.card{pointer-events:auto;max-height:100%;display:flex;flex-direction:column;opacity:1;transform:none;
  transition:opacity .45s var(--ease),transform .6s var(--ease),background-color .9s var(--ease),max-height .6s var(--ease)}
.card.out{opacity:0;transform:translateY(14px)}
#plate.closed .card{opacity:0;transform:translateX(-24px);pointer-events:none}
.bar{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem .5rem 1.2rem;border-bottom:1px solid var(--line);font-size:.76rem;color:var(--muted);flex:none;min-height:2.95rem}
.bar .glyph{color:var(--accent,var(--ink))}
.bar .co{margin-left:auto;white-space:nowrap}
.bar .co + button{margin-left:0}
.bar button{appearance:none;background:none;border:0;cursor:pointer;width:1.9rem;height:1.9rem;display:grid;place-items:center;font-size:1rem;color:var(--ink);flex:none;margin-left:auto}
.bar button:hover{background:var(--line)}
.body{display:flex;flex-direction:column;gap:1rem;padding:1.35rem 1.25rem 1.4rem;align-items:flex-start;overflow-y:auto;overscroll-behavior:contain}
.kind{font-size:.92rem;color:var(--muted)}
.body h1{font-size:clamp(2.8rem,6vw,4.6rem);line-height:.95;letter-spacing:-.02em;margin-left:-.03em}
.body h2{font-size:clamp(1.8rem,3.2vw,2.5rem);line-height:1.06;letter-spacing:-.01em}
.lede{font-size:1.3rem;line-height:1.38}
.meta,.stack,.hint{font-size:.93rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{appearance:none;display:inline-flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border:1px solid var(--ink);text-decoration:none;background:transparent;color:var(--ink);cursor:pointer;
  transition:background-color .35s var(--ease),color .35s var(--ease)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:hover .glyph{clip-path:polygon(50% 0,50% 0,100% 100%,0 100%)}
.btn.tri-first:hover .glyph{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.nav{display:flex;gap:.6rem;padding:.7rem 1.25rem;border-top:1px solid var(--line);flex:none;align-items:center}
.nav .btn{padding:.42rem .8rem;font-size:.95rem}
.nav .sp{margin-left:auto;font-size:.76rem;color:var(--muted)}

.stats{display:grid;gap:.7rem;margin:0;width:100%}
.stat{display:grid;grid-template-columns:5.4rem 1fr;column-gap:.9rem;align-items:center}
.stat dt{grid-column:2;font-size:.9rem;color:var(--muted);line-height:1.3}
.stat dd{grid-column:1;grid-row:1 / span 2;margin:0;font-family:var(--pixel);font-variation-settings:"ELSH" 1;font-size:1.4rem;line-height:1}
.cells{grid-column:2;display:grid;gap:2px;margin-top:.35rem}
.cells i{aspect-ratio:1;background:var(--line)}
.cells i.on{background:var(--accent,var(--ink))}
.kit{margin:0;display:grid;gap:.5rem;font-size:.97rem;width:100%}
.kit div{display:grid;grid-template-columns:8.6rem 1fr;gap:.9rem}
.kit dt{color:var(--muted)}
.kit dd{margin:0}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);width:100%}
.rows li{border-bottom:1px solid var(--line)}
.rows .row{display:grid;grid-template-columns:1rem 1fr;gap:.2rem .8rem;align-items:baseline;padding:.8rem .1rem;text-decoration:none;transition:padding .5s var(--ease),background-color .5s var(--ease)}
.rows a.row:hover{padding-left:.7rem;background:var(--line)}
.rows a.row:hover .glyph{clip-path:polygon(50% 0,50% 0,100% 100%,0 100%)}
.rows .glyph{align-self:center;color:var(--accent)}
.rows .name{font-size:1.2rem}
.rows .what{grid-column:2;color:var(--muted);font-size:.95rem}
.links{display:grid;gap:.15rem;font-size:1.2rem;line-height:1.55}
.links a{display:inline-flex;align-items:center;gap:.7rem;text-decoration:none;flex-wrap:wrap}
.links a:hover .glyph{clip-path:polygon(50% 0,50% 0,100% 100%,0 100%)}
.links small{font-size:.9rem;color:var(--muted)}

@media (max-width:860px){
  #rail,#here{display:none}
  #zoom{bottom:auto;top:4rem}
  #zoom button{width:2.1rem;height:2.1rem}
  #plate{left:.5rem;right:.5rem;width:auto;top:auto;bottom:3.4rem;height:auto;justify-content:flex-end}
  #credit{font-size:.6rem;padding:.3rem .5rem}
  .card{max-height:50vh;max-height:50svh}
  #plate.folded .card{max-height:2.95rem;overflow:hidden}
  #plate.closed .card{transform:translateY(24px)}
  .bar .co{display:none}
  .bar{padding-left:1rem}
  .body{padding:1.05rem 1rem 1.1rem;gap:.8rem}
  .body h1{font-size:clamp(2.3rem,11vw,3rem)}
  .lede{font-size:1.12rem}
  .nav{padding:.55rem 1rem}
  .kit div{grid-template-columns:1fr;gap:0}
  .links{font-size:1.08rem}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<canvas id="map" aria-label="Isometric map of San Francisco. Drag to roam and scroll to zoom." role="img"></canvas>

<header>
  <button class="me chip" id="home" type="button"><span class="glyph"></span><span id="me-name"></span></button>
  <button class="ctl chip" id="stops-btn" type="button"><span class="glyph"></span>Start the walk</button>
  <button class="ctl chip" id="theme" type="button"><span class="glyph"></span><span id="theme-label">Night</span></button>
</header>

<ol id="rail" class="chip" aria-label="Stops on the walk"></ol>
<div id="zoom">
  <span class="px chip" id="here" aria-hidden="true"></span>
  <div class="row">
    <button class="chip" id="z-fit" type="button" aria-label="Show the whole city"><span class="glyph"></span></button>
    <button class="chip" id="z-out" type="button" aria-label="Zoom out">&minus;</button>
    <button class="chip" id="z-in" type="button" aria-label="Zoom in">+</button>
  </div>
</div>
<div id="tip" class="chip" aria-hidden="true"></div>

<footer id="credit" class="px chip">Map artwork © <a href="https://x.com/jus10chavez" target="_blank" rel="noopener">Justin Chavez</a>, from <a href="https://isometricsf.com" target="_blank" rel="noopener">isometricsf.com</a>, used under CC BY-NC 4.0. Map data © OpenStreetMap contributors. Imagery captured from Google Maps 3D Tiles.</footer>

<main id="plate"><article class="card chip" id="card"></article></main>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
